{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="sp-head">
    <h2 class="page-title">{{ heading }}</h2>
    <p>{{ intro }}</p>
</div>

<section class="sp-card" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">
    {% for c in cards %}
    <a href="{{ c.url }}" class="hub-card" style="display:block;padding:16px;border:1px solid var(--line, #d9e2ec);border-radius:12px;text-decoration:none;color:inherit;min-width:0;">
        <div style="font-size:22px;"><i class="bi {{ c.icon }}"></i></div>
        <div style="font-weight:700;margin-top:6px;">{{ c.label }}</div>
        <div class="text-muted small">{{ c.desc }}</div>
    </a>
    {% else %}
    <p class="text-muted">No sections are available for your role.</p>
    {% endfor %}
</section>
{% endblock %}

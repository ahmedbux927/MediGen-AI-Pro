{% extends 'base.html' %}
{% block title %}Add Prescription{% endblock %}
{% block content %}
<style>
    .rx-card { background:#fff; border-radius:16px; padding:28px; border:1px solid #e3e9f2; box-shadow:0 10px 28px rgba(15,31,61,.08); max-width:900px; margin:0 auto; }
    .rx-card h3 { font-weight:800; margin-bottom:18px; }
    .rx-label { font-size:12px; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px; display:block; }
    .rx-input { border:1.5px solid #e2e8f0; border-radius:10px; padding:11px 14px; font-size:14px; background:#f8fafc; width:100%; margin-bottom:14px; }
    .rx-input:focus { outline:none; border-color:#0f9aa0; background:#fff; }
    .rx-hint { font-size:12px; color:#64748b; margin-top:-8px; margin-bottom:14px; }
    .rx-history { background:#fdf6ea; border:1px solid #f1d9a8; border-left:4px solid #d98a1e; color:#8f5a0f; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px; display:none; }
    .rx-table th { font-size:11px; text-transform:uppercase; color:#475569; letter-spacing:.5px; }
    .btn-row { border:none; background:#f1f5f9; color:#0b7b80; border-radius:10px; padding:9px 16px; font-weight:700; }
    .btn-save { border:none; background:linear-gradient(135deg,#0f9aa0,#1f6fb2); color:#fff; border-radius:12px; padding:12px 28px; font-weight:700; }
</style>

<div class="rx-card">
<h3><i class="bi bi-file-medical"></i> Add New Prescription</h3>
<p style="margin:-8px 0 16px;"><a href="{{ url_for('rx_scan') }}"><i class="bi bi-camera"></i> Start from a photo of the paper prescription</a></p>
<form method="POST" id="rxForm">
    <div class="row">
        <div class="col-md-6">
            <label class="rx-label">Patient</label>
            <select name="customer_id" id="custSel" class="rx-input" required>
                <option value="">Select patient</option>
                {% for c in customers %}
                <option value="{{ c.customer_id }}" data-history="{{ '' if session.role == 'Cashier' else (c.medical_history or '') }}">{{ c.name }}</option>
                {% endfor %}
            </select>
            <div class="rx-history" id="histBox"></div>
        </div>
        <div class="col-md-6">
            <label class="rx-label">Doctor name</label>
            <input name="doctor_name" class="rx-input" placeholder="e.g. Ahmed" maxlength="100" required>
            <div class="rx-hint">"Dr." is added automatically when printed.</div>
        </div>
    </div>
    <label class="rx-label">Notes (optional)</label>
    <textarea name="notes" class="rx-input" rows="2" maxlength="1000" placeholder="Advice from the doctor..."></textarea>

    <h5 style="margin: 18px 0 12px;">Medicines</h5>
    <div class="table-responsive">
    <table class="table rx-table" id="itemsTable">
        <thead><tr><th style="min-width:220px;">Medicine</th><th>Dosage</th><th style="width:130px;">Days</th><th style="width:60px;"></th></tr></thead>
        <tbody>
        <tr>
            <td>
                <select name="medicine_id[]" class="rx-input" style="margin-bottom:0;">
                    <option value="">Select medicine</option>
                    {% for m in medicines %}<option value="{{ m.medicine_id }}">{{ m.name }}</option>{% endfor %}
                </select>
            </td>
            <td><input name="dosage[]" class="rx-input" style="margin-bottom:0;" maxlength="100" placeholder="1 tablet twice a day"></td>
            <td><input name="duration[]" type="number" min="1" max="365" class="rx-input" style="margin-bottom:0;" value="3"></td>
            <td><button type="button" class="btn btn-sm btn-danger" onclick="removeRow(this)">X</button></td>
        </tr>
        </tbody>
    </table>
    </div>
    <button type="button" class="btn-row" onclick="addRow()"><i class="bi bi-plus"></i> Add medicine</button>
    <hr>
    <button type="submit" class="btn-save"><i class="bi bi-check2-circle"></i> Save Prescription</button>
    <a href="{{ url_for('prescriptions') }}" class="btn btn-light">Cancel</a>
</form>
</div>

<script>
function addRow() {
    var tbody = document.querySelector('#itemsTable tbody');
    var row = tbody.rows[0].cloneNode(true);
    row.querySelectorAll('input').forEach(function (i) { i.value = ''; });
    row.querySelector('input[name="duration[]"]').value = 3;
    row.querySelector('select').value = '';
    tbody.appendChild(row);
}
function removeRow(btn) {
    var tbody = document.querySelector('#itemsTable tbody');
    if (tbody.rows.length > 1) btn.closest('tr').remove();
}
document.getElementById('custSel').addEventListener('change', function () {
    var box = document.getElementById('histBox');
    var h = this.options[this.selectedIndex] ? this.options[this.selectedIndex].dataset.history : '';
    if (h && h.trim()) {
        box.style.display = 'block';
        box.innerHTML = '';
        var s = document.createElement('strong'); s.textContent = 'Medical history: ';
        box.appendChild(s); box.appendChild(document.createTextNode(h));
    } else {
        box.style.display = 'none';
    }
});
</script>
{% endblock %}
